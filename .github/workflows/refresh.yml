name: Refresh dashboard

on:
  schedule:
    # 6 runs, every 3 hours (UTC). Winter: 5:05, 8:05, 11:05 AM, 2:05, 5:05, 8:05 PM Pacific.
    # Summer (daylight time) shifts an hour later: 6:05 AM to 9:05 PM. Both stay within ~5 AM-9 PM.
    - cron: "5 13,16,19,22,1,4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      # A failed source must not stop the others; the page flags it as stale
      - name: Fetch data
        run: |
          for script in fetch_nwac fetch_snotel fetch_nws fetch_avy; do
            python "$script.py" || echo "::warning::$script failed"
          done

      - run: python build_dashboard.py

      - name: Save data back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push

      - name: Prepare site
        run: |
          mkdir site
          cp dashboard.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
