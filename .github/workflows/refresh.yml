name: Refresh dashboard

on:
  # Started by cron-job.org through GitHub's API (see README). GitHub's own schedule was removed
  # in Nov 2026: it ran only ~3 runs a day, often hours late, whether we asked for 6 or 16.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: America/Los_Angeles
    steps:
      # Start from the newest main, not the commit from when the run was triggered. Runs queue behind
      # each other (cron-job.org plus GitHub's late backup runs), and an older starting point makes
      # the final push fail because an earlier run already saved newer data.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements.txt

      # A failed source must not stop the others; the page flags it as stale
      - name: Fetch data
        run: |
          for script in fetch_nwac fetch_snotel fetch_nws fetch_avy; do
            python "$script.py" || echo "::warning::$script failed"
          done

      - run: python build_dashboard.py

      - name: Save data back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Daily data refresh"
          git push

      - name: Prepare site
        run: |
          mkdir site
          cp dashboard.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
